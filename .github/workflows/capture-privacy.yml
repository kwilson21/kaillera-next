name: Capture privacy
on:
  pull_request:
    paths:
      - '.github/workflows/capture-privacy.yml'
      - 'web/static/kn-capture.js'
      - 'web/src/page/capture.ts'
      - 'web/static/dist/kn-core.js'
      - 'web/static/kn-diagnostics.js'
      - 'web/static/kn-vision-client.js'
      - 'web/src/page/vision-client.ts'
      - 'web/static/netplay-rollback.js'
      - 'web/play.html'
      - 'web/demo.html'
      - 'tests/capture-privacy.test.mjs'
      - 'tests/test_capture_privacy_ui.py'
      - 'tests/test_privacy_page.py'
      - 'tests/test_landing_build.py'
      - 'tests/test_landing_worker.py'
      - 'web/privacy.html'
      - 'web/static/play.css'
      - 'web/index.html'
      - 'web/join.html'
      - 'deploy/static/worker.js'
      - 'scripts/build_landing.py'
      - 'server/**'
      - 'package.json'
      - 'wrangler.landing.jsonc'

permissions:
  contents: read

jobs:
  capture-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The test imports web/src/page/capture.ts directly, which needs a Node
      # that strips types without a flag (22.18 or later).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test image opt-outs and async cancellation
        run: node --test tests/capture-privacy.test.mjs

  privacy-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - name: Install locked Python dependencies and local Worker runtime
        run: |
          python -m pip install uv
          uv sync --directory server --frozen --extra dev
          npm install --ignore-scripts --no-package-lock
      - name: Install Chromium for actual UI checks
        run: uv run --directory server --frozen --extra dev python -m playwright install --with-deps chromium
      - name: Test privacy UI, real Worker routes, and existing server safeguards
        run: |
          uv run --directory server --frozen --extra dev pytest \
            ../tests/test_capture_privacy_ui.py \
            ../tests/test_privacy_page.py \
            ../tests/test_landing_build.py \
            ../tests/test_landing_worker.py \
            ../tests/test_screenshots.py \
            ../tests/test_retention.py \
            ../tests/test_retention_sweep.py \
            ../tests/test_landing_board.py -q
