name: Lint, types, specs and proofs
on:
  # Main itself is checked after every merge: two pull requests that were
  # each green on the main they last merged in can still break it together.
  push:
    branches: [main]
  # Lets a merge queue run these checks, if one is ever switched on.
  merge_group:
  pull_request:
    paths:
      - '.github/workflows/lint.yml'
      - 'web/**'
      - 'deploy/static/**'
      - 'tests/**'
      - 'specs/**'
      - 'tools/oxlint/**'
      - 'scripts/check-specs.sh'
      - 'scripts/browser_shard.py'
      - 'scripts/build_landing.py'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'tsconfig.json'
      - 'LemmaScript-files.txt'
      - 'scripts/build-web.mjs'
      - 'biome.json'
      - 'antislop.toml'
      - 'server/**'
      - 'build/kn_rollback/**'
      - 'scripts/**'
      - 'tools/**'
      - 'oxlint.config.mts'
      - '.oxfmtrc.json'

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Node 24 in every job that runs Node, as in the Docker image's web
      # stage: the TypeScript tests strip types without a flag (22.18+), the
      # observer-report helpers read node:sqlite (22.13+), and the image job
      # compares the bundles built here with the image's.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned tools
        run: npm ci --ignore-scripts
      - name: Format check (oxfmt)
        run: npm run fmt:check
      - name: Lint (oxlint + anti-slop, Biome)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: TypeScript tests
        run: npm run test:ts
      - name: Two-player test's own helpers
        run: node --test tests/frozen-recovery.test.mjs tests/observer-reports.test.mjs tests/link-schedule.test.mjs tests/bundle-check.test.mjs
      # The menu driver the two-player test and the demo page share, against
      # a simulated SSB64 menu at every input delay the engine can set.
      - name: Menu autopilot against a simulated menu
        run: node --test tests/ssb64-menu-autopilot.test.mjs
      - name: Bundles build from web/src
        run: npm run build
      - name: Machine diagram matches web/src/session.ts
        run: npm run diagram:check
      - name: Spec scenario diagrams match the specs
        run: npm run traces:check

  # The same commands, samples and depths as the local full suite, dealt
  # across four native-simulator runners. Keep the stable `spec` gate below: every shard must
  # succeed, including when another shard fails. No affected-test filtering.
  spec-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned tools
        run: npm ci --ignore-scripts
      - name: Install pinned native Quint evaluator
        run: bash scripts/install-quint-evaluator.sh
      - name: Model-check specs (Quint)
        env:
          QUINT_BACKEND: rust
        run: npm run spec -- --shard ${{ matrix.shard }} ${{ strategy.job-total }}

  spec:
    runs-on: ubuntu-latest
    needs: spec-shard
    if: always()
    steps:
      - name: Every model-check shard succeeded
        env:
          RESULT: ${{ needs.spec-shard.result }}
        run: test "$RESULT" = success

  # Exhaustive model checking (Apalache): every run of the specs up to a
  # bounded number of steps, where the spec job's `npm run spec` samples deeper
  # random runs. Separate job because it needs Java. In one job it took 32
  # minutes and grew with every spec, so it runs as parallel shards, each a
  # few groups of checks (scripts/verify-specs.sh, SHARDS), of 4 to 8 minutes.
  spec-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Apalache needs Java 17+, which the runner image already has.
      - name: Install pinned tools
        run: npm ci --ignore-scripts
      # A shard the script has and this matrix does not would never run.
      - name: Every shard has a job
        run: test "$(bash scripts/verify-specs.sh --shards)" = "${{ strategy.job-total }}"
      - name: Verify specs for every run up to 6 steps
        run: bash scripts/verify-specs.sh --shard ${{ matrix.shard }}

  # Proofs for the files in LemmaScript-files.txt. `lsc check` regenerates the
  # Dafny from the annotated TypeScript and verifies it; the diff step fails
  # when the committed .dfy/.dfy.gen are out of date with the source.
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned tools
        run: npm ci --ignore-scripts
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: '4.11.0'
      - name: Verify (LemmaScript, Dafny backend)
        run: npx lsc check --backend=dafny
      - name: Generated Dafny is up to date
        run: |
          git diff --exit-code -- '*.dfy.gen' '*.dfy'
          test -z "$(git ls-files --others --exclude-standard -- '*.dfy.gen' '*.dfy')"

  # Placeholder, deferral and hedging comments across Python, JS/TS, C and
  # shell. Built from the crates.io source; the npm wrapper downloads an
  # unpinned binary in a postinstall script.
  slop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/antislop
          key: antislop-0.3.0-${{ runner.os }}
      - name: Install antislop
        run: test -x ~/.cargo/bin/antislop || cargo install antislop --version 0.3.0 --locked
      - name: antislop
        run: ~/.cargo/bin/antislop --disable stub --no-filename-check .

  # Server unit tests that need no browser and no running server. `--noconftest`
  # skips tests/conftest.py, whose session fixtures launch a browser for the
  # end-to-end tests.
  server-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv
          uv sync --directory server --frozen --extra dev
      # Here, not in the js job: the generator imports the Pydantic models, so
      # it needs the server's Python environment (and no node_modules).
      - name: Generated client schemas match server/src/api/payloads.py
        run: npm run protocol:check
      # The landing tests build the landing pages from the web bundles and run
      # its Worker, as the capture-privacy job does.
      - name: Install locked Node dependencies and build the web bundles
        run: |
          npm ci --ignore-scripts
          npm run build
      # Every test file that needs neither the browser job's server nor
      # Playwright (scripts/browser_shard.py --unit): found by rule, so a new
      # file is never left out of CI.
      - name: Server unit tests
        run: |
          files=$(python scripts/browser_shard.py --unit)
          echo "$files"
          uv run --directory server --frozen --extra dev pytest --noconftest -p no:playwright -q \
            $(printf '../%s ' $files)
      # The desync registry compiled natively and read against a RAM dump of
      # a match: its addresses, the byte order of one-byte fields, the replay
      # rewrite and the address map. Its own conftest builds the library.
      - name: Hash registry against a RAM dump
        run: |
          uv run --directory server --frozen --extra dev pytest -p no:playwright -q \
            --confcutdir ../tests/hash-golden ../tests/hash-golden
      # The rollback engine compiled natively against a stand-in core: what
      # its ring holds after a resync moves the frame counter back. Its own
      # conftest builds the library.
      - name: Rollback engine, natively
        run: |
          uv run --directory server --frozen --extra dev pytest -p no:playwright -q \
            --confcutdir ../tests/rollback-native ../tests/rollback-native

  # The production image builds the TypeScript bundles itself (Dockerfile,
  # stage `web`). This builds the image as Render and the VPS do, and checks
  # that its bundles are byte-for-byte the ones `npm run build` gives here:
  # the landing Worker is built outside the image and its build id must match
  # the server's (server/src/landing_build.py).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the image
        run: docker build -t kaillera-next:ci .
      - name: Bundles in the image
        run: |
          docker run --rm --entrypoint sh kaillera-next:ci -c \
            'cd /app/web/static/dist && sha256sum kn-core.js kn-join.js kn-landing.js kn-site.js kn-wake-art.js' > image.sha
          cat image.sha
      - name: Bundles built here
        run: |
          npm ci --ignore-scripts --omit=dev
          npm run build
          (cd web/static/dist && sha256sum kn-core.js kn-join.js kn-landing.js kn-site.js kn-wake-art.js) > local.sha
          diff image.sha local.sha
      - name: The image serves the play page with its bundle
        run: |
          docker run -d --name kn -p 27888:27888 -e ADMIN_KEY=ci -e DISABLE_HTTPS=1 kaillera-next:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:27888/health && break; sleep 1; done
          curl -fsS http://localhost:27888/static/dist/kn-core.js -o /dev/null
          curl -fsS http://localhost:27888/api/landing-build
          docker logs kn | tail -20
