name: Lint, types, specs and proofs
on:
  pull_request:
    paths:
      - '.github/workflows/lint.yml'
      - 'web/**'
      - 'deploy/static/**'
      - 'tests/**'
      - 'specs/**'
      - 'tools/oxlint/**'
      - 'scripts/check-specs.sh'
      - 'package.json'
      - 'tsconfig.json'
      - 'LemmaScript-files.txt'
      - 'scripts/build-web.mjs'
      - 'biome.json'
      - 'antislop.toml'
      - 'server/**'
      - 'build/kn_rollback/**'
      - 'scripts/**'
      - 'tools/**'
      - 'oxlint.config.mts'
      - '.oxfmtrc.json'

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned tools
        run: npm install --ignore-scripts --no-package-lock
      - name: Format check (oxfmt)
        run: npm run fmt:check
      - name: Lint (oxlint + anti-slop, Biome)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: TypeScript tests
        run: npm run test:ts
      - name: Committed bundle matches web/src
        run: npm run build:check
      - name: Machine diagram matches web/src/session.ts
        run: npm run diagram:check
      - name: Model-check specs (Quint)
        run: npm run spec

  # Exhaustive model checking (Apalache): every run of the specs up to a
  # bounded number of steps, where the js job's `npm run spec` samples deeper
  # random runs. Separate job because it needs Java and takes several minutes.
  spec-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Apalache needs Java 17+, which the runner image already has.
      - name: Install pinned tools
        run: npm install --ignore-scripts --no-package-lock
      - name: Verify specs for every run up to 6 steps
        run: npm run spec:verify

  # Proofs for the files in LemmaScript-files.txt. `lsc check` regenerates the
  # Dafny from the annotated TypeScript and verifies it; the diff step fails
  # when the committed .dfy/.dfy.gen are out of date with the source.
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned tools
        run: npm install --ignore-scripts --no-package-lock
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: '4.11.0'
      - name: Verify (LemmaScript, Dafny backend)
        run: npx lsc check --backend=dafny
      - name: Generated Dafny is up to date
        run: |
          git diff --exit-code -- '*.dfy.gen' '*.dfy'
          test -z "$(git ls-files --others --exclude-standard -- '*.dfy.gen' '*.dfy')"

  # Placeholder, deferral and hedging comments across Python, JS/TS, C and
  # shell. Built from the crates.io source; the npm wrapper downloads an
  # unpinned binary in a postinstall script.
  slop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/antislop
          key: antislop-0.3.0-${{ runner.os }}
      - name: Install antislop
        run: test -x ~/.cargo/bin/antislop || cargo install antislop --version 0.3.0 --locked
      - name: antislop
        run: ~/.cargo/bin/antislop --disable stub --no-filename-check .

  # Server unit tests that need no browser and no running server. `--noconftest`
  # skips tests/conftest.py, whose session fixtures launch a browser for the
  # end-to-end tests. A new server test file belongs in this list.
  server-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv
          uv sync --directory server --frozen --extra dev
      # Here, not in the js job: the generator imports the Pydantic models, so
      # it needs the server's Python environment (and no node_modules).
      - name: Generated client schemas match server/src/api/payloads.py
        run: npm run protocol:check
      - name: Server unit tests
        run: |
          uv run --directory server --frozen --extra dev pytest --noconftest -p no:playwright -q \
            ../tests/test_session_reports.py \
            ../tests/test_host_reload.py \
            ../tests/test_resume_refused.py \
            ../tests/test_abandoned_match.py \
            ../tests/test_relay_sender.py \
            ../tests/test_schema.py \
            ../tests/test_query_builder.py \
            ../tests/test_room_logic.py \
            ../tests/test_protocol_payloads.py \
            ../tests/test_db.py \
            ../tests/test_db_backends.py \
            ../tests/test_d1_backend.py \
            ../tests/test_migrate.py \
            ../tests/test_session_logging.py \
            ../tests/test_session_log_http.py \
            ../tests/test_session_log_entries.py \
            ../tests/test_match_registration.py \
            ../tests/test_retention.py \
            ../tests/test_retention_sweep.py \
            ../tests/test_screenshots.py \
            ../tests/test_state.py \
            ../tests/test_emulator_boot_sequence.py
