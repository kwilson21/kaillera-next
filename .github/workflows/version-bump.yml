name: Release batch

on:
  schedule:
    - cron: '15 11 * * 2'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of the verified main commit to release
        type: string
        required: true
      player_notes:
        description: Player-facing changelog bullets, one per line
        type: string
        required: true

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_SHA: ${{ github.event_name == 'schedule' && github.sha || inputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Select the release commit
        id: batch
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Enter the full SHA of the verified main commit."
            exit 1
          fi
          tip=$(git rev-parse HEAD)
          last_version=$(git log --first-parent --format=%H --grep='^chore(version):' -1)
          if [[ -z "$last_version" ]]; then
            echo "::error::Could not find the previous version commit."
            exit 1
          fi
          if [[ "$GITHUB_RUN_ATTEMPT" -gt 1 && "$(git rev-parse "$last_version^")" == "$RELEASE_SHA" ]]; then
            # A deployment retry uses the same version and changelog.
            git checkout --detach "$last_version"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          elif [[ "$tip" == "$RELEASE_SHA" && "$last_version" != "$tip" ]]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            echo "::notice::No release: the scheduled commit is stale or main has no unreleased changes."
          else
            echo "::error::The verified SHA must be the current main tip with unreleased changes."
            exit 1
          fi

      - name: Select player notes
        id: notes
        if: steps.batch.outputs.bump == 'true'
        env:
          MANUAL_NOTES: ${{ inputs.player_notes }}
          SCHEDULED_RELEASE: ${{ vars.SCHEDULED_RELEASE }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            notes=$(jq -sce --arg sha "$RELEASE_SHA" \
              'select(length == 1) | .[0] | objects | select(.commit == $sha) | .player_notes | strings | select(test("[^[:space:]]"))' \
              <<< "$SCHEDULED_RELEASE" 2>/dev/null) || notes=
            if [[ -z "$notes" ]]; then
              echo "::notice::No release: player notes are missing for $RELEASE_SHA."
              exit 0
            fi
          else
            notes=$(jq -cn --arg notes "$MANUAL_NOTES" '$notes')
          fi
          printf '%s\n' "player_notes_json=$notes" >> "$GITHUB_OUTPUT"

      - name: Require successful main checks
        id: checks
        if: steps.batch.outputs.bump == 'false' || steps.notes.outputs.player_notes_json != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in lint.yml browser.yml capture-privacy.yml; do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --branch main --event push --commit "$RELEASE_SHA" --limit 1 \
              --json status,conclusion --jq '.[0] | select(.status == "completed") | .conclusion')
            if [[ "$result" != success ]]; then
              if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
                echo "::notice::No release: $workflow has no successful run for $RELEASE_SHA."
                exit 0
              fi
              echo "::error::$workflow has no successful run for $RELEASE_SHA."
              exit 1
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.checks.outputs.ready == 'true'
        with:
          node-version: 24

      - name: Version and publish the batch
        if: steps.checks.outputs.ready == 'true' && steps.batch.outputs.bump == 'true'
        env:
          PLAYER_NOTES_JSON: ${{ steps.notes.outputs.player_notes_json }}
        run: |
          PLAYER_NOTES=$(jq -r . <<< "$PLAYER_NOTES_JSON")
          export PLAYER_NOTES
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/bump-version.sh
          # If main advanced after checkout, reject both the branch and tag.
          git push --atomic --follow-tags origin main

      - name: Deploy to Render
        if: steps.checks.outputs.ready == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set. See deploy/render/README.md."
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null --retry 3 \
            --request POST --url-query "ref=$(git rev-parse HEAD)" "$RENDER_DEPLOY_HOOK_URL"
          echo "Asked Render to deploy $(git rev-parse --short HEAD)."

      - name: Deploy the landing Worker
        if: steps.checks.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set."
            exit 1
          fi
          npm ci --ignore-scripts
          python3 scripts/build_landing.py
          npx wrangler deploy -c wrangler.landing.jsonc
          echo "Deployed the landing Worker from $(git rev-parse --short HEAD)."
