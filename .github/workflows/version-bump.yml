name: Version Bump

on:
  push:
    branches: [main]

# One release at a time: a second merge waits for the first one's bump and
# deploy instead of racing it.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Only feat: and fix: commits bump the version. Every push still deploys.
      - name: Decide whether this push bumps the version
        id: plan
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          case "$MESSAGE" in
            feat:* | feat\(* | fix:* | fix\(*) echo "bump=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "bump=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-node@v7
        if: steps.plan.outputs.bump == 'true'
        with:
          node-version: 20

      - name: Configure git
        if: steps.plan.outputs.bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run version bump
        if: steps.plan.outputs.bump == 'true'
        # `just deploy` invokes the script with no args (range = origin/main..HEAD).
        # Here, post-squash-merge, origin/main == HEAD, so we pass --from with
        # the pre-push SHA (github.event.before) so the script's RANGE covers
        # exactly the commits the merge introduced. Everything else — bump
        # rule, changelog, commit, tag — is identical to local `just deploy`.
        run: bash scripts/bump-version.sh --from "${{ github.event.before }}"

      - name: Push version bump
        if: steps.plan.outputs.bump == 'true'
        run: git push --follow-tags

      # The only thing that deploys the site. Render's own auto-deploy is off
      # (render.yaml): it ran one deploy for the merge and a second for the
      # version commit seconds later, and on the free plan the second could be
      # killed while the service was being put back to sleep. The hook deploys
      # the tip of main, which by now includes the version commit. A push made
      # with GITHUB_TOKEN starts no workflow, so this runs once per merge.
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set, so nothing was deployed. See deploy/render/README.md."
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null --retry 3 --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Asked Render to deploy main at $(git rev-parse --short HEAD)."
