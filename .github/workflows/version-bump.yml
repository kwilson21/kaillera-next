name: Version Bump

on:
  push:
    branches: [main]

# One release at a time. GitHub keeps one waiting run per group and cancels an
# older waiting one, so a run must not depend on having seen its own push:
# each run works from the tip of main and covers everything since the last
# version commit, which makes up for any run that was cancelled or failed.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run version bump
        # `just deploy` invokes the script with no args (range = origin/main..HEAD).
        # Here origin/main == HEAD, so we pass --from with the last
        # chore(version) commit: the range is every commit released since.
        # The script bumps only if that range holds a feat: or fix: commit.
        # Everything else — bump rule, changelog, commit, tag — is identical
        # to local `just deploy`.
        run: |
          last_version=$(git log --format=%H --grep='^chore(version):' -1)
          bash scripts/bump-version.sh --from "$last_version"

      - name: Push version bump
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "No version commit to push."
          else
            git push --follow-tags
          fi

      # The only thing that deploys the site. Render's own auto-deploy is off
      # (render.yaml): it ran one deploy for the merge and a second for the
      # version commit seconds later, and on the free plan the second could be
      # killed while the service was being put back to sleep. The hook deploys
      # the tip of main, which by now includes the version commit. A push made
      # with GITHUB_TOKEN starts no workflow, so this runs once per merge.
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set, so nothing was deployed. See deploy/render/README.md."
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null --retry 3 --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Asked Render to deploy main at $(git rev-parse --short HEAD)."
