repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix, --config, server/pyproject.toml]
        files: ^server/
      - id: ruff-format
        args: [--config, server/pyproject.toml]
        files: ^server/

  # JS tooling runs from node_modules (`just setup`): oxfmt formats, oxlint
  # (with the vendored anti-slop rules) and Biome lint. Versions are pinned in
  # package.json.
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        entry: npx oxfmt --no-error-on-unmatched-pattern
        language: system
        types_or: [javascript, css, json, yaml, html]
        exclude: ^(build/src/|web/static/ejs/|node_modules/)
      - id: oxlint
        name: oxlint
        entry: npx oxlint
        language: system
        files: ^(web/static|deploy/static|tests)/.*\.m?js$
        exclude: ^web/static/ejs/
      - id: biome-lint
        name: biome lint
        entry: npx biome lint --no-errors-on-unmatched
        language: system
        files: ^(web/static|deploy/static|tests)/.*\.m?js$
        exclude: ^web/static/ejs/
      - id: quint-specs
        name: Quint specs
        entry: bash scripts/check-specs.sh
        language: system
        files: ^specs/
        pass_filenames: false
      - id: check-hash-citations
        name: Hash registry citation check
        entry: bash scripts/check-hash-citations.sh
        language: system
        files: ^build/kn_rollback/kn_hash_registry\.h$
        pass_filenames: false
# Note: version bumping moved out of the post-commit hook. Run `just deploy`
# to bump version + tag + push as a single explicit operation. See
# scripts/bump-version.sh for the bump logic.
