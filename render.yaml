# Render Blueprint: the free fallback host for the public site.
# Render builds the Dockerfile from main and redeploys on every merge.
# Setup and switching between Render and a self-hosted server: deploy/render/README.md
services:
  - type: web
    name: kaillera-next
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Render's own https://<name>.onrender.com URL is added at startup
      # (RENDER_EXTERNAL_URL), so the service works before DNS points here.
      - key: ALLOWED_ORIGIN
        value: https://kaillera-next.thesuperhuman.us
      # Hard rule: the public site never transfers ROMs between players.
      - key: ROM_SHARING_ENABLED
        value: 'false'
      # Only Render's proxy reaches the container; honor its forwarded headers.
      - key: TRUSTED_PROXY_IPS
        value: '*'
      # Generated by Render once, stored in the service's environment.
      - key: ADMIN_KEY
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      # Cloudflare TURN: entered in the Render dashboard (never committed).
      - key: CF_TURN_KEY_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
      # ── Off until the owner's OK (docs/landing-design.md §7.12) ──────────
      # Keepalive: every open play page fetches /health this often, so the
      # free instance can't nap under a live room. Uncomment to switch on.
      # - key: KEEPALIVE_SECONDS
      #   value: '300'
      # Rooms survive restarts and naps: point REDIS_URL at the Key Value
      # instance below (uncomment both blocks together).
      # - key: REDIS_URL
      #   fromService:
      #     type: keyvalue
      #     name: kaillera-next-kv
      #     property: connectionString
      # Static landing page on another origin (hosting option B in
      # deploy/static/README.md): let it read /health, /list, /room/*.
      # - key: PUBLIC_ORIGINS
      #   value: https://<static-origin>

  # Render Key Value (free): room persistence for REDIS_URL above.
  # - type: keyvalue
  #   name: kaillera-next-kv
  #   plan: free
  #   ipAllowList: []  # reachable only from services in this workspace
