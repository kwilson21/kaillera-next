# Render Blueprint: the free fallback host for the public site.
# Render builds the Dockerfile from main and redeploys on every merge.
# Setup and switching between Render and a self-hosted server: deploy/render/README.md
services:
  - type: web
    name: kaillera-next
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Render's own https://<name>.onrender.com URL is added at startup
      # (RENDER_EXTERNAL_URL), so the service works before DNS points here.
      - key: ALLOWED_ORIGIN
        value: https://kaillera-next.thesuperhuman.us
      # Hard rule: the public site never transfers ROMs between players.
      - key: ROM_SHARING_ENABLED
        value: 'false'
      # Only Render's proxy reaches the container; honor its forwarded headers.
      - key: TRUSTED_PROXY_IPS
        value: '*'
      # Generated by Render once, stored in the service's environment.
      - key: ADMIN_KEY
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      # Cloudflare TURN: entered in the Render dashboard (never committed).
      - key: CF_TURN_KEY_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
      # Cloudflare D1: the database lives there so logs survive deploys,
      # restarts and naps (deploy/render/README.md). Set all three together:
      # the server refuses to start with a partial D1 configuration.
      - key: CF_ACCOUNT_ID
        sync: false
      - key: D1_DATABASE_ID
        sync: false
      - key: D1_API_TOKEN
        sync: false
      # Cloudflare R2 bucket for screenshots (src/blobstore.py). Uses
      # CF_ACCOUNT_ID above. Set all three together: a partial R2
      # configuration also stops the server from starting.
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Set by hand in the Render dashboard (2026-09-26); listed here so a
      # Blueprint sync never overwrites them. See docs/landing-design.md §7.12.
      # REDIS_URL: internal URL of the kaillera-next-kv Key Value instance
      # (free plan), so rooms survive restarts and naps.
      - key: REDIS_URL
        sync: false
      # Play pages fetch /health this often, so the free instance can't nap
      # under a live room (300 in production).
      - key: KEEPALIVE_SECONDS
        sync: false
      # Shared with the landing Worker (its PROXY_SECRET): lets the server trust
      # the visitor IP the Worker forwards in X-KN-Client-IP (ratelimit.py).
      # May hold a comma-separated list ("new,old") to rotate the secret
      # without a gap: the server trusts either while both are listed.
      - key: KN_PROXY_SECRET
        sync: false
      # Static landing page on another origin (hosting option B in
      # deploy/static/README.md; option A, the one chosen, doesn't need it).
      # - key: PUBLIC_ORIGINS
      #   value: https://<static-origin>
